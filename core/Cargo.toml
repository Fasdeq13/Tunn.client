[package]
name = "tunn-backend"
version = "4.4.0"
edition = "2021"
description = "Tunn shared core"

[lib]
name = "tunn_backend"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["socks-proxy"] }
base64 = "0.22"
percent-encoding = "2"
rand = "0.9"
