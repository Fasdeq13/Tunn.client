[package]
name = "tunn"
version = "3.8.0"
edition = "2021"
description = "Tunn"

[[bin]]
name = "tunn"
path = "src/main.rs"

[dependencies]
fasdeq-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["socks-proxy"] }
resvg = "0.45"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.9"
flate2 = "1"
tar = "0.4"
tiny_http = "0.12"
directories = "6"
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tray-icon = { version = "0.21", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
auto-launch = "0.5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[build-dependencies]
slint-build = "1"
cc = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
sha2 = "0.10"

[patch.crates-io]
slint-macros = { path = "stubs/slint-macros" }
