[package]
name = "fasdeqvpn"
version = "3.2.0"
edition = "2021"
description = "FasdeqVPN"

[[bin]]
name = "fasdeqvpn"
path = "src/main.rs"

[dependencies]
fasdeq-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["socks-proxy"] }
resvg = "0.45"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.9"
tiny_http = "0.12"
directories = "6"
tao = "0.34"
wry = "0.53"
tray-icon = "0.21"
rfd = "0.15"
auto-launch = "0.5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
