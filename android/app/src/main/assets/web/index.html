<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Tunn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="glow"></div>
  <main id="views">
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-servers" data-view="servers"></section>
    <section class="view" id="view-settings" data-view="settings"></section>
  </main>
  <nav id="nav" aria-label="Разделы">
    <button class="nav-item" data-go="home"><span class="nav-pill"><svg viewBox="0 0 24 24"><path id="i-nav-home" d=""/></svg></span><span class="nav-label">Главная</span></button>
    <button class="nav-item" data-go="servers"><span class="nav-pill"><svg viewBox="0 0 24 24"><path id="i-nav-servers" d=""/></svg></span><span class="nav-label">Серверы</span></button>
    <button class="nav-item" data-go="settings"><span class="nav-pill"><svg viewBox="0 0 24 24"><path id="i-nav-settings" d=""/></svg></span><span class="nav-label">Настройки</span></button>
  </nav>
  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="snack"></div>
</div>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
